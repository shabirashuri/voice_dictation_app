[alembic]
script_location = alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

[alembic:env]
# sqlalchemy.url can be provided here as a fallback, but it's strongly
# recommended to set SUPABASE_DB_URL in your environment when running
# migrations so credentials aren't checked into source control.
sqlalchemy.url = driver://user:pass@localhost/dbname
